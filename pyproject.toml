[project]
name = "workorder2data"
version = "0.1.0"
description = "Convert raw CMMS maintenance text into ISO 14224 structured records"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Iraj Ahangari", email = "ahangarii@gmail.com" }]
requires-python = ">=3.13"
dependencies = [
    "anthropic>=1.11.0",
    "pydantic>=2.13.5",
    "pyyaml>=6.0.3",
]

[project.scripts]
w2d = "workorder2data.cli:main"

[build-system]
requires = ["uv_build>=0.9.26,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
